[build]
  publish = "."
  # Gera vitrine, fichas e destaques da home a partir de imoveis/_dados/, que o
  # plugin imoveis-blobs preenche com o que o painel /admin gravou no Blobs
  command = "node scripts/gerar-imoveis.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "./plugins/imoveis-blobs"

[dev]
  publish = "."
  port = 8888
  framework = "#static"
  autoLaunch = false

# CDN de imagens (aceita qualquer URL externa)
[images]
  remote_images = ["https://.*"]

# Home na raiz do site
[[redirects]]
  from = "/"
  to = "/home/index.html"
  status = 200
  force = true

# Rebranding: o clube "Clube do Leilão" virou "Leilão & Prosa" (jul/2026).
# Sem force de propósito: o diretório antigo não existe mais, então não há
# arquivo para o redirect competir. Manter enquanto houver links antigos
# circulando em anúncios, e-mails e no grupo do WhatsApp.
[[redirects]]
  from = "/clube-do-leilao/*"
  to = "/leilao-e-prosa/:splat"
  status = 301

# Redirect www → apex (dominio principal)
[[redirects]]
  from = "https://www.fazmorar.com.br/*"
  to = "https://fazmorar.com.br/:splat"
  status = 301
  force = true

# Redirect www → apex (leilãoeprosa.com em punycode, dominio secundario)
[[redirects]]
  from = "https://www.xn--leiloeprosa-c8a.com/*"
  to = "https://xn--leiloeprosa-c8a.com/:splat"
  status = 301
  force = true

# O template do framework ainda responde em /index.html e seria indexavel
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Specs internos da pagina do evento nao sao pagina do site
[[redirects]]
  from = "/evento/layout.md"
  to = "/evento/"
  status = 301
  force = true

[[redirects]]
  from = "/evento/copy.md"
  to = "/evento/"
  status = 301
  force = true

# Dados crus do painel (inclui rascunhos), codigo de build e dependencias nao sao pagina do site
[[redirects]]
  from = "/imoveis/_dados/*"
  to = "/imoveis/"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/plugins/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true

# Headers de seguranca
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Painel de imoveis fora do Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Cache para assets estaticos
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
